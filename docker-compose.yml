services:
  yieldo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ${YIELDO_CONTAINER_NAME:-yieldo}
    restart: unless-stopped
    ports:
      - "${YIELDO_PORT:-8080}:8000"
    environment:
      YIELDO_SECRET_KEY: ${YIELDO_SECRET_KEY:?SECRET_KEY manquant — lancez ./install.sh install}
      YIELDO_REGISTRATION_OPEN: ${YIELDO_REGISTRATION_OPEN:-false}
      YIELDO_ACCESS_TOKEN_MINUTES: ${YIELDO_ACCESS_TOKEN_MINUTES:-30}
      YIELDO_REFRESH_TOKEN_DAYS: ${YIELDO_REFRESH_TOKEN_DAYS:-30}
      YIELDO_LLM_TIMEOUT_SECONDS: ${YIELDO_LLM_TIMEOUT_SECONDS:-120}
      YIELDO_CORS_ORIGINS: ${YIELDO_CORS_ORIGINS:-[]}
      # Addresses of the reverse proxies whose X-Forwarded-* headers uvicorn
      # believes: the HTTPS scheme (Secure cookie) and the client address (login
      # throttle) come from them. "*" when the proxy's address is not fixed.
      FORWARDED_ALLOW_IPS: ${YIELDO_TRUSTED_PROXIES:-127.0.0.1}
    volumes:
      - ./data:/app/data

  # Agent EZLink du connecteur « Yieldo Finance ». Désactivé par défaut : il ne démarre qu'avec
  # `docker compose --profile ezlink up -d`, une fois ./ezlink/ préparé (agent.yaml, certs/,
  # yieldo_key). Il ouvre lui-même la connexion vers EZLink : aucun port n'est publié, et la clé
  # ycn_ ne quitte jamais cette machine. Voir README, « Claude par EZLink : Yieldo Finance ».
  ezlink-agent:
    profiles: ["ezlink"]
    build:
      context: ${EZLINK_REPO:-https://github.com/Ezoxe/EZLink.git#main}
      dockerfile: deploy/agent-yieldo/Dockerfile
    container_name: ${YIELDO_CONTAINER_NAME:-yieldo}-ezlink-agent
    restart: unless-stopped
    depends_on:
      - yieldo
    volumes:
      - ./ezlink:/etc/ezlink:ro
